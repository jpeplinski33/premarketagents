<html lang="en">
<head>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #0c0c0d;
      --bg-elev: #141416;
      --bg-soft: #1a1a1d;
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.14);
      --ink: #f5f2eb;
      --muted: #9a958c;
      --gold: #c4a574;
      --gold-soft: #d4bc94;
      --gold-dim: rgba(196,165,116,0.18);
      --danger: #b85c4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--gold-soft); text-decoration: none; }
    a:hover { color: #fff; }
    button { font-family: inherit; }

    /* —— Brand header —— */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      background: rgba(12,12,13,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1;
      gap: 3px;
    }
    .brand-pre {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: 26px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .brand-agents {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--gold);
      padding-left: 2px;
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .header-meta .dot { opacity: 0.35; }
    @media (max-width: 640px) {
      .header-meta .hide-sm { display: none; }
      .brand-pre { font-size: 22px; letter-spacing: 0.14em; }
    }

    /* —— Hero gallery —— */
    .gallery {
      position: relative;
      background: #000;
      height: min(68vh, 640px);
      min-height: 300px;
      user-select: none;
      touch-action: pan-y;
    }
    .gallery .main-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .gallery-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 42%);
    }
    .gallery-badge {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 5;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 10px 14px 11px;
      background: rgba(12,12,13,0.78);
      border: 1px solid var(--gold-dim);
      backdrop-filter: blur(10px);
    }
    .gallery-badge .pm {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1;
    }
    .gallery-badge .ag {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(12,12,13,0.55);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    .nav-btn:hover { background: rgba(12,12,13,0.85); border-color: var(--gold); }
    .nav-btn.prev { left: 14px; }
    .nav-btn.next { right: 14px; }
    .gallery-tools {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .counter, .see-all {
      background: rgba(12,12,13,0.72);
      border: 1px solid var(--line-strong);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 12px;
      cursor: pointer;
    }
    .see-all:hover { border-color: var(--gold); color: var(--gold-soft); }

    .thumbs-wrap {
      background: var(--bg-elev);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }
    .thumbs {
      display: flex;
      gap: 4px;
      padding: 10px 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .thumbs::-webkit-scrollbar { height: 5px; }
    .thumbs::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .thumb {
      flex: 0 0 92px;
      height: 64px;
      border: 1px solid transparent;
      opacity: 0.55;
      cursor: pointer;
      overflow: hidden;
      background: #222;
    }
    .thumb.active { opacity: 1; border-color: var(--gold); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    
    .exclusive-banner {
      width: 100%;
      margin: 4px 0 14px;
      padding: 14px 16px;
      border: 1px solid rgba(196,165,116,0.35);
      background: linear-gradient(135deg, rgba(196,165,116,0.12), rgba(196,165,116,0.04));
    }
    .exclusive-banner-kicker {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .exclusive-banner p {
      font-size: 14px;
      color: #c8c3b8;
      line-height: 1.55;
      max-width: 62ch;
      margin: 0;
    }
    .exclusive-banner strong { color: var(--ink); font-weight: 600; }

    /* —— Body —— */
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 22px 80px;
    }
    .status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .badge-pre {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 7px 12px 8px;
      background: var(--gold-dim);
      border: 1px solid rgba(196,165,116,0.35);
      line-height: 1;
      gap: 3px;
    }
    .badge-pre .pm {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-soft);
    }
    .badge-pre .ag {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .price {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(36px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin: 6px 0 4px;
    }
    .facts-line {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .facts-line span { color: var(--muted); font-weight: 400; margin: 0 8px; }
    .address {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 22px;
      letter-spacing: 0.01em;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 36px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin: 0 0 14px;
      color: var(--ink);
    }
    section {
      border-top: 1px solid var(--line);
      padding: 26px 0;
    }
    section:first-of-type { border-top: none; padding-top: 0; }
    .desc p {
      margin-bottom: 14px;
      color: #c8c3b8;
      font-size: 15px;
      line-height: 1.65;
      max-width: 62ch;
    }
    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 24px;
      list-style: none;
      font-size: 14px;
      color: #c8c3b8;
    }
    @media (max-width: 560px) { .feature-grid { grid-template-columns: 1fr; } }
    .feature-grid li {
      padding-left: 14px;
      position: relative;
    }
    .feature-grid li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.7;
    }

    .facts-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .facts-table tr { border-bottom: 1px solid var(--line); }
    .facts-table th, .facts-table td {
      text-align: left;
      padding: 12px 8px;
      vertical-align: top;
    }
    .facts-table th {
      width: 40%;
      font-weight: 500;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    .facts-table td { font-weight: 500; color: var(--ink); }

    .fp-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .fp-tab {
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .fp-tab.active {
      border-color: var(--gold);
      color: var(--gold-soft);
      background: var(--gold-dim);
    }
    .fp-view {
      background: var(--bg-soft);
      border: 1px solid var(--line);
      overflow: auto;
      max-height: 520px;
      text-align: center;
    }
    .fp-view img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* —— Agent card —— */
    .side-card {
      border: 1px solid var(--line-strong);
      background: linear-gradient(165deg, #17171a 0%, #101012 100%);
      padding: 22px;
      position: sticky;
      top: 84px;
    }
    @media (max-width: 900px) { .side-card { position: static; } }
    .side-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    .agent-row {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 16px;
    }
    .agent-photo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(196,165,116,0.4);
      flex-shrink: 0;
      background: #222;
    }
    .agent-name {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.15;
    }
    .agent-co {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.04em;
    }
    .agent-bio {
      font-size: 13px;
      color: #a8a39a;
      line-height: 1.55;
      margin-bottom: 16px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--gold);
      color: #0c0c0d !important;
      text-decoration: none !important;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 14px 12px;
      border: none;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary:hover { background: var(--gold-soft); color: #0c0c0d !important; }
    .btn-secondary {
      display: block;
      width: 100%;
      text-align: center;
      background: transparent;
      color: var(--ink) !important;
      text-decoration: none !important;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px;
      border: 1px solid var(--line-strong);
      cursor: pointer;
    }
    .btn-secondary:hover { border-color: var(--gold); color: var(--gold-soft) !important; }
    .side-meta {
      margin-top: 16px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    /* —— Footer —— */
    .site-footer {
      border-top: 1px solid var(--line);
      padding: 28px 22px 40px;
      text-align: center;
    }
    .footer-brand {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }
    .footer-brand .pm {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 20px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .footer-brand .ag {
      font-size: 9px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
    }
    .site-footer p {
      font-size: 12px;
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 6px;
      line-height: 1.55;
    }

    /* —— Lightbox —— */
    .lb {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 200;
      flex-direction: column;
    }
    .lb.open { display: flex; }
    .lb-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #222;
    }
    .lb-top span { font-size: 13px; color: #ccc; letter-spacing: 0.06em; }
    .lb-close {
      background: transparent;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .lb-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 0;
      padding: 12px;
    }
    .lb-stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .lb .nav-btn { background: rgba(255,255,255,0.1); }

    .grid-all {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 190;
      background: var(--bg);
      overflow-y: auto;
      padding: 20px;
    }
    .grid-all.open { display: block; }
    .grid-all-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 8px 0 12px;
      z-index: 2;
      border-bottom: 1px solid var(--line);
    }
    .grid-all-top h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 22px;
      font-weight: 500;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 6px;
    }
    .photo-grid button {
      border: none;
      padding: 0;
      background: #111;
      cursor: pointer;
      aspect-ratio: 4/3;
      overflow: hidden;
    }
    .photo-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }
    .photo-grid button:hover img { transform: scale(1.04); }

    /* —— Invite map —— */
    .map-section {
      margin: 36px 0 8px;
      width: 100%;
    }
    .map-section h2 { margin-bottom: 14px; }
    .map-layout {
      display: grid;
      grid-template-columns: 1fr minmax(260px, 320px);
      gap: 0;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      min-height: min(72vh, 720px);
    }
    @media (max-width: 800px) {
      .map-layout { grid-template-columns: 1fr; min-height: 0; }
    }
    #invite-map {
      height: min(72vh, 720px);
      min-height: 520px;
      background: #111;
    }
    @media (max-width: 800px) {
      #invite-map { height: 56vh; min-height: 380px; }
    }
    .leaflet-container { font-family: Inter, sans-serif; background: #0c0c0d; width: 100%; height: 100%; }
    .pma-map-panel {
      border-left: 1px solid var(--line);
      padding: 18px;
      font-size: 13px;
      color: #b8b3a8;
      max-height: min(72vh, 720px);
      overflow-y: auto;
    }
    @media (max-width: 800px) {
      .pma-map-panel { border-left: none; border-top: 1px solid var(--line); max-height: none; }
    }
    .pma-map-panel-head {
      font-size: 10px; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
    }
    .pma-map-panel h4 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 20px; color: var(--ink); font-weight: 600; margin-bottom: 8px;
    }
    .pma-map-panel .k { color: var(--muted); display: inline-block; min-width: 7.5em; }
    .pma-map-panel .tag {
      display: inline-block; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--gold); border: 1px solid rgba(196,165,116,0.35); padding: 3px 8px; margin-bottom: 10px;
    }
    .pma-map-panel .note { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
    .pma-map-panel .muted { color: var(--muted); }
    .pma-map-links { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .pma-map-links .btn-link {
      display: block; text-align: center; padding: 10px;
      background: var(--gold); color: #0c0c0d !important; font-weight: 700;
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .pma-map-links .btn-link.ghost {
      background: transparent; color: var(--ink) !important;
      border: 1px solid var(--line-strong);
    }
    .pma-owner-label { background: transparent !important; border: none !important; }
    .pma-owner-label span {
      display: inline-block; padding: 0; background: transparent !important; color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
      border: none !important; white-space: nowrap;
      max-width: 150px; overflow: hidden; text-overflow: ellipsis;
      text-shadow:
        0 0 4px rgba(0,0,0,0.95),
        0 1px 3px rgba(0,0,0,0.95),
        0 0 10px rgba(0,0,0,0.75),
        1px 1px 0 rgba(0,0,0,0.55),
        -1px -1px 0 rgba(0,0,0,0.55);
    }

    #invite-gate {
      min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center;
      padding: 40px 22px;
    }
    #invite-gate[hidden] { display: none !important; }
    #invite-content[hidden] { display: none !important; }
    .gate-card {
      width: 100%; max-width: 420px; border: 1px solid var(--line-strong);
      background: linear-gradient(165deg, #17171a 0%, #101012 100%); padding: 28px 24px;
    }
    .gate-card .eyebrow {
      font-size: 10px; font-weight: 700; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 12px;
    }
    .gate-card h1 {
      font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500;
      font-size: 28px; margin-bottom: 10px;
    }
    .gate-card p { color: var(--muted); font-size: 14px; line-height: 1.55; margin-bottom: 18px; }
    .gate-card label {

  <script>
    window.PMA_INVITE_SEED = {
      agentSlug: "alan-hinson",
      listingCode: "3czjbv9",

  <script src="/js/invite-registry.js?v=18"></script>
  <script src="/js/invite-crypto.js?v=1"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/js/invite-analytics.js?v=6"></script>
  <script src="/js/invite-map.js?v=7"></script>
  <script>
    (function () {
      var PHOTOS = []; // filled from the encrypted payload after unlock

      let listingStarted = false;
      function startListing() {
      if (listingStarted) return;
      listingStarted = true;

      var CLIENT_TOKEN = (window.PMAInviteRegistry && PMAInviteRegistry.tokenFromLocation()) || "";
      const analytics = new PMAInviteAnalytics({
        agentSlug: "alan-hinson",
        listingCode: "3czjbv9",
        clientToken: CLIENT_TOKEN,
        endpoint: ""
      });
      analytics.mountDisclosure({ agentName: "Alan D. Hinson" });
      analytics.bindListing();

      let idx = 0;
      const mainImg = document.getElementById("mainImg");
      const counter = document.getElementById("counter");
      const thumbs = document.getElementById("thumbs");
      const lb = document.getElementById("lightbox");
      const lbImg = document.getElementById("lbImg");
      const lbCounter = document.getElementById("lbCounter");
      const gridAll = document.getElementById("gridAll");
      const photoGrid = document.getElementById("photoGrid");

      function renderThumbs() {
        thumbs.innerHTML = "";
        PHOTOS.forEach((p, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "thumb" + (i === idx ? " active" : "");
          b.setAttribute("role", "option");
          b.setAttribute("aria-selected", i === idx ? "true" : "false");
          b.innerHTML = '<img src="' + p.src + '" alt="" loading="lazy" />';
          b.addEventListener("click", () => show(i));
          thumbs.appendChild(b);
        });
        const active = thumbs.querySelector(".thumb.active");
        if (active) active.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      }

      function show(i) {
        idx = (i + PHOTOS.length) % PHOTOS.length;
        const p = PHOTOS[idx];
        mainImg.src = p.src;
        mainImg.alt = p.alt;
        counter.textContent = (idx + 1) + " / " + PHOTOS.length;
        lbImg.src = p.src;
        lbCounter.textContent = (idx + 1) + " / " + PHOTOS.length;
        renderThumbs();
        analytics.photoShow(idx, PHOTOS.length);
      }

      function openLb() {
        lb.classList.add("open");
        lb.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        analytics.track("lightbox_open", { index: idx });
      }
      function closeLb() {
        lb.classList.remove("open");
        lb.setAttribute("aria-hidden", "true");
        if (!gridAll.classList.contains("open")) document.body.style.overflow = "";
      }
      function openGrid() {
        photoGrid.innerHTML = "";
        PHOTOS.forEach((p, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.innerHTML = '<img src="' + p.src + '" alt="' + p.alt + '" loading="lazy" />';
          b.addEventListener("click", () => {
            show(i);
            closeGrid();
            openLb();
          });
          photoGrid.appendChild(b);
        });
        gridAll.classList.add("open");
        gridAll.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        analytics.track("photo_grid_open", { total: PHOTOS.length });
      }
      function closeGrid() {
        gridAll.classList.remove("open");
        gridAll.setAttribute("aria-hidden", "true");
        if (!lb.classList.contains("open")) document.body.style.overflow = "";
      }

      document.getElementById("prevBtn").addEventListener("click", () => show(idx - 1));
      document.getElementById("nextBtn").addEventListener("click", () => show(idx + 1));
      document.getElementById("lbPrev").addEventListener("click", () => show(idx - 1));
      document.getElementById("lbNext").addEventListener("click", () => show(idx + 1));
      document.getElementById("lbClose").addEventListener("click", closeLb);
      document.getElementById("seeAllBtn").addEventListener("click", openGrid);
      document.getElementById("gridClose").addEventListener("click", closeGrid);
      mainImg.addEventListener("click", openLb);

      // swipe
      let touchX = null;
      const stage = document.getElementById("gallery");
      stage.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].screenX; }, { passive: true });
      stage.addEventListener("touchend", (e) => {
        if (touchX == null) return;
        const dx = e.changedTouches[0].screenX - touchX;
        if (Math.abs(dx) > 40) show(idx + (dx < 0 ? 1 : -1));
        touchX = null;
      }, { passive: true });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { closeLb(); closeGrid(); }
        if (e.key === "ArrowLeft") show(idx - 1);
        if (e.key === "ArrowRight") show(idx + 1);
      });

      // floor plans
      document.querySelectorAll(".fp-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".fp-tab").forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById("fpImg").src = tab.dataset.fp;
        });
      });

      show(0);

      // Invite map
      const map = new PMAInviteMap("#invite-map", {
        analytics: analytics,
        showOwners: true,
        dataUrl: "/data/hanbys-parcels-invite.geojson"
      });
      map.init().then(function () {
        if (map.map) {
          setTimeout(function () { map.map.invalidateSize(); }, 200);
          setTimeout(function () { map.map.invalidateSize(); }, 600);
        }
      });
      } // end startListing

      // The gate returns the decrypted payload. Photo paths only exist after
      // unlock, so PHOTOS must be filled before the gallery renders.
      function pmaOnUnlock(info) {
        if (info && info.payload && info.payload.photos) {
          PHOTOS = info.payload.photos;
        }
        startListing();
      }

      PMAInviteGate.mount({ agentSlug: "alan-hinson", listingCode: "3czjbv9", agentName: "Alan D. Hinson", requireClientToken: true, onUnlock: pmaOnUnlock
      });
    })();
  </script>
