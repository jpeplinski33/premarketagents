<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pre Market Agents | Your private look, before the market</title>
  <meta name="description" content="Your private look, before the market. Pre Market Agents — exclusive pre-market home previews shared by invitation from your realtor." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://premarketagents.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://premarketagents.com/" />
  <meta property="og:title" content="Pre Market Agents | Your private look, before the market" />
  <meta property="og:description" content="Exclusive pre-market home previews — shared by invitation from your realtor." />
  <meta property="og:image" content="https://premarketagents.com/images/og/home-private-look.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Pre Market Agents" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://premarketagents.com/images/og/home-private-look.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    /* Landing-only: full-bleed night estate */
    body.landing-home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #050506;
    }
    body.landing-home .site-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: transparent;
      border-bottom: none;
      backdrop-filter: none;
    }
    body.landing-home .site-header .brand-pre,
    body.landing-home .site-header .nav a {
      text-shadow: 0 1px 12px rgba(0,0,0,0.55);
    }
    body.landing-home main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .landing-hero {
      position: relative;
      flex: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .landing-hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    /* Soft edge vignette so header/footer read cleanly */
    .landing-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(5,5,6,0.45) 0%, transparent 18%, transparent 78%, rgba(5,5,6,0.72) 100%),
        linear-gradient(90deg, rgba(5,5,6,0.35) 0%, transparent 28%, transparent 72%, rgba(5,5,6,0.25) 100%);
    }
    /* Accessible HTML copy — sits over the same zone as the baked-in art text.
       Visually subtle so the photo leads; screen readers + SEO still get the words. */
    .landing-copy {
      position: relative;
      z-index: 1;
      max-width: 22ch;
      padding: 0 28px;
      text-align: left;
      margin-right: auto;
      margin-left: clamp(4vw, 8vw, 12vw);
      margin-top: -4vh;
    }
    .landing-copy .brand-mark {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 22px;
    }
    .landing-copy .brand-mark .pre {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(18px, 2.4vw, 26px);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #f5f2eb;
      text-shadow: 0 2px 28px rgba(0,0,0,0.65);
    }
    .landing-copy .brand-mark .agents {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.48em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 1px 16px rgba(0,0,0,0.55);
    }
    .landing-copy h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(34px, 5.2vw, 54px);
      line-height: 1.12;
      color: #faf7f0;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 32px rgba(0,0,0,0.7);
      max-width: 14ch;
    }
    /* When art already paints the words, keep HTML for a11y but avoid double-read */
    .landing-copy.is-over-art .brand-mark,
    .landing-copy.is-over-art h1 {
      /* Image already includes brand + headline — hide visual double, keep in DOM for a11y/SEO */
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .landing-foot {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px 24px;
      padding: 20px 24px 28px;
    }
    .landing-foot p {
      font-size: 12px;
      color: rgba(245,242,235,0.72);
      letter-spacing: 0.04em;
      max-width: 42ch;
      line-height: 1.5;
      text-shadow: 0 1px 10px rgba(0,0,0,0.6);
    }
    .landing-foot-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .landing-foot .btn-ghost {
      border-color: rgba(255,255,255,0.28);
      color: #f5f2eb !important;
      background: rgba(12,12,13,0.35);
      backdrop-filter: blur(8px);
    }
    .landing-foot .btn-ghost:hover {
      border-color: var(--gold);
      color: var(--gold-soft) !important;
    }
    @media (max-width: 640px) {
      .landing-foot {
        flex-direction: column;
        align-items: flex-start;
      }
      body.landing-home .site-header .nav .hide-sm { display: none; }
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://premarketagents.com/#organization",
        "name": "Pre Market Agents",
        "url": "https://premarketagents.com/",
        "description": "Private pre-market home previews shared by realtor invitation."
      },
      {
        "@type": "WebSite",
        "@id": "https://premarketagents.com/#website",
        "url": "https://premarketagents.com/",
        "name": "Pre Market Agents",
        "publisher": { "@id": "https://premarketagents.com/#organization" }
      }
    ]
  }
  </script>
</head>
<body class="landing-home">
  <header class="site-header">
    <a class="brand" href="/" aria-label="Pre Market Agents home">
      <span class="brand-pre">Pre Market</span>
      <span class="brand-agents">Agents</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a class="hide-sm" href="/learn/">Learn</a>
      <a class="hide-sm" href="/explore/">Explore</a>
      <a class="btn btn-ghost" href="/login/">Realtor login</a>
    </nav>
  </header>

  <main>
    <section class="landing-hero" aria-label="Pre Market Agents">
      <img
        class="landing-hero-img"
        src="/images/marketing/hero-private-look.jpg"
        srcset="/images/marketing/hero-private-look.jpg 1200w, /images/marketing/hero-private-look.png 1200w"
        sizes="100vw"
        width="1200"
        height="630"
        alt="Night view of a lit estate home — Pre Market Agents: Your private look, before the market."
        fetchpriority="high"
      />
      <div class="landing-copy is-over-art">
        <div class="brand-mark">
          <span class="pre">Pre Market</span>
          <span class="agents">Agents</span>
        </div>
        <h1>Your private look, before the market.</h1>
      </div>
      <div class="landing-foot">
        <p>Private pre-market previews — by invitation from your realtor.</p>
        <div class="landing-foot-actions">
          <a class="btn btn-primary" href="/login/">Realtor login</a>
          <a class="btn btn-ghost" href="/learn/">Learn more</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
